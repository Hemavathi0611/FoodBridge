services:
  mongodb:
    image: mongo:8
    container_name: foodbridge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - foodbridge-mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodbridge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/foodbridge
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: http://localhost:5174
    depends_on:
      - mongodb

volumes:
  foodbridge-mongo-data:
