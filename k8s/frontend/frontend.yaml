apiVersion: apps/v1
kind: Deployment
metadata:
  name: foodbridge-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: foodbridge-frontend
  template:
    metadata:
      labels:
        app: foodbridge-frontend
    spec:
      containers:
        - name: frontend
          image: foodbridge-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: foodbridge-frontend
spec:
  type: NodePort
  selector:
    app: foodbridge-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
